<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Drill coverage</title>
<link rel="stylesheet" href="base.css">
<link rel="stylesheet" href="meter.css">
<link rel="stylesheet" href="segmented.css">
<link rel="stylesheet" href="matrix.css">
<link rel="stylesheet" href="checklist.css">
<link rel="stylesheet" href="links.css">
<link rel="stylesheet" href="coverage.css">
</head>
<body>
<header>
  <div class="row">
    <h1>Drill coverage</h1>
    <span id="open-in"></span>
    <span class="spacer"></span>
    <select id="run" aria-label="Run"></select>
    <button id="refresh" title="Reload">↻</button>
  </div>
  <div id="meters" class="row meters"></div>
  <div class="row" style="margin-top:6px">
    <span id="views"></span>
    <label class="muted check"><input type="checkbox" id="missed"> Unexercised only</label>
    <span class="spacer"></span>
  </div>
  <details id="stores">
    <summary class="muted">Compare with app telemetry</summary>
    <div class="store-list">
      <input id="store-filter" type="search" placeholder="Filter by app, session or path" aria-label="Filter stores">
      <div id="store-error"></div>
      <div id="store-rows"><span class="muted">Loading…</span></div>
      <div class="row"><button id="apply-stores" class="primary">Compare</button></div>
    </div>
  </details>
  <div id="banners" aria-live="polite"></div>
</header>
<main id="main"><div class="empty muted">Loading…</div></main>
<script src="common.js"></script>
<script src="meter.js"></script>
<script src="segmented.js"></script>
<script src="matrix.js"></script>
<script src="checklist.js"></script>
<script src="links.js"></script>
<script src="coverage.js"></script>
</body>
</html>
