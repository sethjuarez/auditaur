<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Drill snapshots</title>
<link rel="stylesheet" href="base.css">
<link rel="stylesheet" href="compare.css">
<link rel="stylesheet" href="links.css">
<link rel="stylesheet" href="snapshots.css">
</head>
<body>
<header>
  <div class="row">
    <h1>Drill snapshots</h1>
    <span id="open-in"></span>
    <span class="spacer"></span>
    <select id="run" aria-label="Run"></select>
    <button id="refresh" title="Reload">↻</button>
  </div>
  <div class="row" style="margin-top:6px">
    <span id="modes" class="row" role="group" aria-label="Screenshot view"></span>
    <span class="spacer"></span>
    <button id="accept-all" class="primary">Accept all changed</button>
  </div>
  <div id="summary" class="muted" style="font-size:12px;margin-top:4px"></div>
  <div id="banners" aria-live="polite"></div>
</header>
<main id="main"><div class="empty muted">Loading…</div></main>
<script src="common.js"></script>
<script src="compare.js"></script>
<script src="links.js"></script>
<script src="snapshots.js"></script>
</body>
</html>
