[package]
name = "auditaur-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Command-line interface and MCP server for inspecting Auditaur local telemetry."
readme = "README.md"
categories = ["command-line-utilities", "development-tools::debugging"]
keywords = ["tauri", "cli", "observability", "opentelemetry"]

[[bin]]
name = "auditaur"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
auditaur-collector = { version = "0.1.1", path = "../auditaur-collector" }
auditaur-core = { version = "0.1.1", path = "../auditaur-core" }
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
time.workspace = true

[dev-dependencies]
tempfile.workspace = true
