[package]
name = "auditaur-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Command-line interface and MCP server for inspecting Auditaur local telemetry."
readme = "README.md"
categories = ["command-line-utilities", "development-tools::debugging"]
keywords = ["tauri", "cli", "observability", "opentelemetry"]

[[bin]]
name = "auditaur"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
auditaur-collector = { version = "0.4.29", path = "../auditaur-collector" }
auditaur-core = { version = "0.4.29", path = "../auditaur-core" }
base64.workspace = true
clap.workspace = true
ctrlc = "3"
dunce = "1"
png = "0.18"
regex = "1"
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
time.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_Threading"] }

[dev-dependencies]
jsonschema = { version = "0.60.1", default-features = false }
tempfile.workspace = true
