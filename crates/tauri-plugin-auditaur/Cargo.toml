[package]
name = "tauri-plugin-auditaur"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Development-first Tauri plugin for collecting Auditaur local telemetry."
readme = "README.md"
categories = ["development-tools::debugging"]
keywords = ["tauri", "plugin", "observability", "opentelemetry"]
links = "tauri-plugin-auditaur"

[dependencies]
auditaur-collector = { version = "0.3.2", path = "../auditaur-collector" }
auditaur-core = { version = "0.3.2", path = "../auditaur-core" }
base64.workspace = true
directories.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri-plugin-auditaur-macros = { version = "0.3.2", path = "../tauri-plugin-auditaur-macros" }
tauri = { workspace = true, features = ["wry"] }
time.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
xcap = "0.9.6"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.38.2"
windows = { version = "0.61.3", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
objc2 = "0.6.3"
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "NSBitmapImageRep",
    "NSImage",
    "NSImageRep",
] }
objc2-core-foundation = "0.3.2"
objc2-foundation = { version = "0.3.2", default-features = false, features = [
    "NSData",
    "NSDictionary",
    "NSError",
    "NSObject",
    "NSString",
    "NSValue",
] }
objc2-web-kit = { version = "0.3.2", default-features = false, features = [
    "WKSnapshotConfiguration",
    "WKWebView",
    "block2",
    "objc2-core-foundation",
] }

[dev-dependencies]
tempfile.workspace = true

[build-dependencies]
tauri-plugin = { version = "2.6.2", features = ["build"] }
