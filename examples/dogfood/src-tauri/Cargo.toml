[package]
name = "auditaur-dogfood"
version = "0.1.0"
edition = "2021"
publish = false
build = "build.rs"

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.12.5", features = [] }
tauri-plugin-auditaur = { path = "../../../crates/tauri-plugin-auditaur" }
tracing = "0.1"
tracing-subscriber = "0.3"
