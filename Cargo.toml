[workspace]
members = [
    "crates/auditaur-cli",
    "crates/auditaur-core",
    "crates/auditaur-collector",
    "crates/tauri-plugin-auditaur-macros",
    "crates/tauri-plugin-auditaur",
]
exclude = ["examples/dogfood/src-tauri"]
resolver = "2"

[workspace.package]
version = "0.2.4"
edition = "2021"
license = "MIT"
repository = "https://github.com/sethjuarez/auditaur"

[workspace.dependencies]
anyhow = "1"
base64 = "0.22.1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "parsing", "serde"] }
uuid = { version = "1", features = ["serde", "v4"] }
rusqlite = { version = "0.37", features = ["bundled"] }
tempfile = "3"
tauri = { version = "2.11.2", default-features = false }
directories = "6"
tracing = "0.1"
tracing-subscriber = "0.3"
tungstenite = "0.29.0"
proc-macro-crate = "3"
proc-macro2 = "1"
quote = "1"
syn = "2"
