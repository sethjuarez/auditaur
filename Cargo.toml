[workspace]
members = [
    "crates/auditaur-cli",
    "crates/auditaur-core",
    "crates/auditaur-collector",
    "crates/tauri-plugin-auditaur",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/sethjuarez/auditaur"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "parsing", "serde"] }
uuid = { version = "1", features = ["serde", "v4"] }
rusqlite = { version = "0.37", features = ["bundled"] }
tempfile = "3"
tauri = { version = "2.11.2", default-features = false }
directories = "6"
