name: Publish Frontend API

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run npm publish in dry-run mode"
        default: true
        required: true
        type: boolean

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-api
  cancel-in-progress: false

jobs:
  publish:
    name: Publish @auditaur/api
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'api-v')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
          cache: npm
          cache-dependency-path: packages/api/package-lock.json
      - run: npm ci
        working-directory: packages/api
      - run: npm test
        working-directory: packages/api
      - run: npm run build
        working-directory: packages/api
      - name: Dry-run npm publish
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        run: npm publish --dry-run --access public
        working-directory: packages/api
      - name: Publish to npm
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && !inputs.dry_run)
        run: npm publish --provenance --access public
        working-directory: packages/api
