name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-workspace:
    name: Rust workspace (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libayatana-appindicator3-dev \
            libegl1-mesa-dev \
            libgbm-dev \
            libpipewire-0.3-dev \
            librsvg2-dev \
            libwayland-dev \
            libwebkit2gtk-4.1-dev
      - uses: Swatinem/rust-cache@v2
      - run: python scripts/check-skill-drift.py
      - run: cargo test --workspace -- --test-threads=1

  api:
    name: Frontend API
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: packages/api/package-lock.json
      - run: npm install
        working-directory: packages/api
      # The CLI's drill minimum, bridge protocol, and docs pins must agree with the api (AR-1).
      - run: python scripts/check-compat.py
      # Vitest strips types, so test files are only typechecked here.
      - run: npm run typecheck
        working-directory: packages/api
      - run: npm test
        working-directory: packages/api
      - run: npm run build
        working-directory: packages/api
      # Runs the built dist/ through consumer bundlers (esbuild, rolldown); they rewrite code (AR-9).
      - run: npm run test:bundles
        working-directory: packages/api
      # Packs the api, installs the tarball, and imports it with plain Node (AR-19).
      - run: npm run test:node-import
        working-directory: packages/api
      - run: npm audit --audit-level=moderate
        working-directory: packages/api
        continue-on-error: true

  drills-ui:
    name: Drills canvas
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: packages/drills-ui/package-lock.json
      - run: npm ci
        working-directory: packages/drills-ui
      - run: npm run typecheck
        working-directory: packages/drills-ui
      # Extension server tests (route, panel store, actions, HTTP API).
      - run: npm test
        working-directory: packages/drills-ui
      - run: npm run build
        working-directory: packages/drills-ui
      # The bundle is committed so the extension and `auditaur init` need no Node build; it must match its source.
      - name: Check committed bundle is current
        run: git diff --exit-code -- .github/extensions/auditaur-drills/ui crates/auditaur-cli/assets/auditaur-drills/ui

  swift-apple-package:
    name: Swift Apple package
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: swift test

  docs:
    name: Docs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - run: npm install
        working-directory: docs
      - run: npm run build
        working-directory: docs
      - run: npm audit --audit-level=moderate
        working-directory: docs
        continue-on-error: true

  dogfood-web:
    name: Dogfood web
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            packages/api/package-lock.json
            examples/dogfood/package-lock.json
      - run: npm install
        working-directory: packages/api
      - run: npm run build
        working-directory: packages/api
      - run: npm install
        working-directory: examples/dogfood
      - run: npm run build:web
        working-directory: examples/dogfood
      - run: npm audit --audit-level=moderate
        working-directory: examples/dogfood
        continue-on-error: true

  # Picks the drill legs: the api in this branch, plus the npm tarball users install when one
  # matches this branch's packages/api/src. The published leg proves this branch's CLI and plugin
  # work with the shipped api (AR-1, AR-19); feature PRs with unreleased api changes skip it.
  drill-api-legs:
    name: Pick drill api legs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      legs: ${{ steps.pick.outputs.legs }}
      version: ${{ steps.pick.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          # check-api-released.py reads history since the api release tag.
          fetch-depth: 0
      - id: pick
        run: |
          version=$(python scripts/check-api-released.py --published-version)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ -n "$version" ]; then
            echo 'legs=["source","published"]' >> "$GITHUB_OUTPUT"
          else
            echo 'legs=["source"]' >> "$GITHUB_OUTPUT"
            echo "::notice::No published @auditaur/api matches packages/api/src; only the source-api drills run."
          fi

  tauri-drills:
    name: Dogfood Tauri drills (${{ matrix.api }} api)
    needs: drill-api-legs
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        api: ${{ fromJSON(needs.drill-api-legs.outputs.legs) }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            examples/dogfood/src-tauri -> target
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            packages/api/package-lock.json
            examples/dogfood/package-lock.json
      - run: npm install
        working-directory: packages/api
      - run: npm install
        working-directory: examples/dogfood
      # Replaces the file: link with the npm tarball; the app build below also typechecks against it.
      - name: Install the published api
        if: matrix.api == 'published'
        working-directory: examples/dogfood
        env:
          VERSION: ${{ needs.drill-api-legs.outputs.version }}
        run: |
          npm install --no-save "@auditaur/api@$env:VERSION"
          # Version alone can't tell the npm package from the file: link to packages/api.
          $api = Get-Item node_modules/@auditaur/api
          if ($api.LinkType) { throw "@auditaur/api is still a $($api.LinkType) to the source package" }
          $installed = (Get-Content node_modules/@auditaur/api/package.json | ConvertFrom-Json).version
          if ($installed -ne $env:VERSION) { throw "expected @auditaur/api $env:VERSION from npm, found $installed" }
          "@auditaur/api $installed from npm"
      # A debug build embeds the frontend, so no dev server is needed, and keeps the drive bridge on.
      - run: npm run tauri build -- --debug --no-bundle
        working-directory: examples/dogfood
      - run: cargo build -p auditaur-cli
      # Screenshots (@visual) depend on the machine's DPI and fonts, so CI checks everything else.
      - name: Run drills
        working-directory: examples/dogfood
        run: >
          ..\..\target\debug\auditaur.exe drill test
          --grep-invert '@visual' --update-snapshots=none --junit drill-results.xml
          --app auditaur-dogfood --timeout-seconds 300
          -- src-tauri\target\debug\auditaur-dogfood.exe
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dogfood-drill-runs-${{ matrix.api }}-api
          path: |
            examples/dogfood/drill-results.xml
            examples/dogfood/.auditaur/drill-runs/
          if-no-files-found: ignore
          # Runs live under .auditaur/, which upload-artifact skips by default.
          include-hidden-files: true