name: Rust Release

on:
  workflow_dispatch:
    inputs:
      command:
        description: "Release-plz command to run"
        required: true
        default: prepare
        type: choice
        options:
          - prepare
          - publish

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: release-rust
  cancel-in-progress: false

jobs:
  release-pr:
    name: Open release PR
    runs-on: ubuntu-latest
    if: "${{ inputs.command == 'prepare' }}"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify skill asset matches repo skill
        run: python scripts/check-skill-drift.py
      - name: Verify CLI, api, and docs compatibility
        run: python scripts/check-compat.py
      - name: Verify @auditaur/api changes are released
        run: python scripts/check-api-released.py
      - name: Verify Rust release graph
        run: |
          python - <<'PY'
          import json
          import subprocess
          import sys

          metadata = json.loads(subprocess.check_output([
              "cargo",
              "metadata",
              "--no-deps",
              "--format-version",
              "1",
          ]))
          packages = {package["name"]: package for package in metadata["packages"]}
          macro = packages.get("tauri-plugin-auditaur-macros")
          plugin = packages.get("tauri-plugin-auditaur")
          if macro is None:
              sys.exit("tauri-plugin-auditaur-macros must be a workspace package")
          if plugin is None:
              sys.exit("tauri-plugin-auditaur must be a workspace package")

          macro_dep = next(
              (dep for dep in plugin["dependencies"] if dep["name"] == "tauri-plugin-auditaur-macros"),
              None,
          )
          if macro_dep is None:
              sys.exit("tauri-plugin-auditaur must depend on tauri-plugin-auditaur-macros")
          if macro_dep["req"] != f"^{macro['version']}":
              sys.exit(
                  "tauri-plugin-auditaur-macros dependency version "
                  f"{macro_dep['req']} does not match macro crate version {macro['version']}"
              )
          print(
              "Verified tauri-plugin-auditaur depends on "
              f"tauri-plugin-auditaur-macros {macro['version']}"
          )
          PY
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libayatana-appindicator3-dev \
            libegl1-mesa-dev \
            libgbm-dev \
            libpipewire-0.3-dev \
            librsvg2-dev \
            libwayland-dev \
            libwebkit2gtk-4.1-dev
      - uses: Swatinem/rust-cache@v2
      - name: Run release-plz PR
        id: release-plz
        uses: MarcoIeni/release-plz-action@v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # release-plz bumps Cargo.toml only; the Copilot plugin and marketplace versions follow it.
      # Runs whenever a release PR exists, whether this run opened it or updated it.
      - name: Stamp the Copilot plugin version on the release PR
        env:
          PR: ${{ steps.release-plz.outputs.pr }}
        run: |
          branch=$(jq -r '.head_branch // empty' <<<"${PR:-null}" 2>/dev/null || true)
          if [ -z "$branch" ]; then
            echo "No release PR to stamp."
            exit 0
          fi
          git fetch origin "+refs/heads/$branch:refs/remotes/origin/$branch"
          git switch -C "$branch" "origin/$branch"
          python scripts/check-skill-drift.py --write
          git add -A plugins .github/plugin .github/extensions crates/auditaur-cli/assets
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore(plugin): stamp the Copilot plugin version"
            git push origin "$branch"
          fi

  publish:
    name: Publish if release PR
    runs-on: ubuntu-latest
    if: "${{ inputs.command == 'publish' }}"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify skill asset matches repo skill
        run: python scripts/check-skill-drift.py
      - name: Verify CLI, api, and docs compatibility
        run: python scripts/check-compat.py
      - name: Verify @auditaur/api changes are released
        run: python scripts/check-api-released.py
      - name: Verify Rust release graph
        run: |
          python - <<'PY'
          import json
          import subprocess
          import sys

          metadata = json.loads(subprocess.check_output([
              "cargo",
              "metadata",
              "--no-deps",
              "--format-version",
              "1",
          ]))
          packages = {package["name"]: package for package in metadata["packages"]}
          macro = packages.get("tauri-plugin-auditaur-macros")
          plugin = packages.get("tauri-plugin-auditaur")
          if macro is None:
              sys.exit("tauri-plugin-auditaur-macros must be a workspace package")
          if plugin is None:
              sys.exit("tauri-plugin-auditaur must be a workspace package")

          macro_dep = next(
              (dep for dep in plugin["dependencies"] if dep["name"] == "tauri-plugin-auditaur-macros"),
              None,
          )
          if macro_dep is None:
              sys.exit("tauri-plugin-auditaur must depend on tauri-plugin-auditaur-macros")
          if macro_dep["req"] != f"^{macro['version']}":
              sys.exit(
                  "tauri-plugin-auditaur-macros dependency version "
                  f"{macro_dep['req']} does not match macro crate version {macro['version']}"
              )
          print(
              "Verified tauri-plugin-auditaur depends on "
              f"tauri-plugin-auditaur-macros {macro['version']}"
          )
          PY
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libayatana-appindicator3-dev \
            libegl1-mesa-dev \
            libgbm-dev \
            libpipewire-0.3-dev \
            librsvg2-dev \
            libwayland-dev \
            libwebkit2gtk-4.1-dev
      - uses: Swatinem/rust-cache@v2
      - name: Run release-plz publish
        uses: MarcoIeni/release-plz-action@v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
