name: Rust Release

on:
  workflow_dispatch:
    inputs:
      command:
        description: "Release-plz command to run"
        required: true
        default: prepare
        type: choice
        options:
          - prepare
          - publish

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: release-rust
  cancel-in-progress: false

jobs:
  release-pr:
    name: Open release PR
    runs-on: ubuntu-latest
    if: "${{ inputs.command == 'prepare' }}"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify skill asset matches repo skill
        run: python scripts/check-skill-drift.py
      - name: Verify Rust release graph
        run: |
          python - <<'PY'
          import json
          import subprocess
          import sys

          metadata = json.loads(subprocess.check_output([
              "cargo",
              "metadata",
              "--no-deps",
              "--format-version",
              "1",
          ]))
          packages = {package["name"]: package for package in metadata["packages"]}
          macro = packages.get("tauri-plugin-auditaur-macros")
          plugin = packages.get("tauri-plugin-auditaur")
          if macro is None:
              sys.exit("tauri-plugin-auditaur-macros must be a workspace package")
          if plugin is None:
              sys.exit("tauri-plugin-auditaur must be a workspace package")

          macro_dep = next(
              (dep for dep in plugin["dependencies"] if dep["name"] == "tauri-plugin-auditaur-macros"),
              None,
          )
          if macro_dep is None:
              sys.exit("tauri-plugin-auditaur must depend on tauri-plugin-auditaur-macros")
          if macro_dep["req"] != f"^{macro['version']}":
              sys.exit(
                  "tauri-plugin-auditaur-macros dependency version "
                  f"{macro_dep['req']} does not match macro crate version {macro['version']}"
              )
          print(
              "Verified tauri-plugin-auditaur depends on "
              f"tauri-plugin-auditaur-macros {macro['version']}"
          )
          PY
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libayatana-appindicator3-dev \
            libpipewire-0.3-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev
      - uses: Swatinem/rust-cache@v2
      - name: Run release-plz PR
        uses: MarcoIeni/release-plz-action@v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    name: Publish if release PR
    runs-on: ubuntu-latest
    if: "${{ inputs.command == 'publish' }}"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify skill asset matches repo skill
        run: python scripts/check-skill-drift.py
      - name: Verify Rust release graph
        run: |
          python - <<'PY'
          import json
          import subprocess
          import sys

          metadata = json.loads(subprocess.check_output([
              "cargo",
              "metadata",
              "--no-deps",
              "--format-version",
              "1",
          ]))
          packages = {package["name"]: package for package in metadata["packages"]}
          macro = packages.get("tauri-plugin-auditaur-macros")
          plugin = packages.get("tauri-plugin-auditaur")
          if macro is None:
              sys.exit("tauri-plugin-auditaur-macros must be a workspace package")
          if plugin is None:
              sys.exit("tauri-plugin-auditaur must be a workspace package")

          macro_dep = next(
              (dep for dep in plugin["dependencies"] if dep["name"] == "tauri-plugin-auditaur-macros"),
              None,
          )
          if macro_dep is None:
              sys.exit("tauri-plugin-auditaur must depend on tauri-plugin-auditaur-macros")
          if macro_dep["req"] != f"^{macro['version']}":
              sys.exit(
                  "tauri-plugin-auditaur-macros dependency version "
                  f"{macro_dep['req']} does not match macro crate version {macro['version']}"
              )
          print(
              "Verified tauri-plugin-auditaur depends on "
              f"tauri-plugin-auditaur-macros {macro['version']}"
          )
          PY
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libayatana-appindicator3-dev \
            libpipewire-0.3-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev
      - uses: Swatinem/rust-cache@v2
      - name: Run release-plz publish
        uses: MarcoIeni/release-plz-action@v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
