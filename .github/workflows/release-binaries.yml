name: Release CLI binaries

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-binaries-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.target }}
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'auditaur-cli-v')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows-x64
            rust_target: x86_64-pc-windows-msvc
            msvc_arch: amd64
            binary: auditaur.exe
            asset: auditaur-windows-x64.exe
          - os: windows-11-arm
            target: windows-arm64
            rust_target: aarch64-pc-windows-msvc
            msvc_arch: arm64
            binary: auditaur.exe
            asset: auditaur-windows-arm64.exe
          - os: macos-latest
            target: macos-arm64
            rust_target: aarch64-apple-darwin
            binary: auditaur
            asset: auditaur-macos-arm64
          - os: ubuntu-latest
            target: linux-x64
            rust_target: x86_64-unknown-linux-gnu
            binary: auditaur
            asset: auditaur-linux-x64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}
      - uses: ilammy/msvc-dev-cmd@v1
        if: startsWith(matrix.os, 'windows')
        with:
          arch: ${{ matrix.msvc_arch }}
      - uses: Swatinem/rust-cache@v2
      - name: Build CLI
        run: cargo build -p auditaur-cli --release --target ${{ matrix.rust_target }}
      - name: Prepare asset
        shell: pwsh
        run: |
          Copy-Item "target/${{ matrix.rust_target }}/release/${{ matrix.binary }}" "${{ matrix.asset }}"
      - name: Upload release asset
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" "${{ matrix.asset }}" --clobber
      - name: Upload workflow artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
